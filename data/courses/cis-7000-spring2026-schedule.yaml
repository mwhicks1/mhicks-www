      pdf: '/courses/cis-7000-spring2026/downloads/SSEM-data-analysis-2.pdf'

  - date: "Feb 12"
    topic: "Measurements of security #1 (vulnerability oriented)"
    readings: 
      - 'Ruef, Andrew, Michael Hicks, James Parker, Dave Levin, Michelle L. Mazurek, and Piotr Mardziel. [Build it, break it, fix it: Contesting secure development](https://dl.acm.org/doi/10.1145/2976749.2978382). CCS 2016. *Note*: [Long version of this paper](https://dl.acm.org/doi/abs/10.1145/3383773) from 2020, which has more detail and another contest problem.'
      - text: 'Votipka, Daniel, Kelsey R. Fulton, James Parker, Matthew Hou, Michelle L. Mazurek, and Michael Hicks. [Understanding security mistakes developers make: Qualitative analysis from build it, break it, fix it](https://www.usenix.org/conference/usenixsecurity20/presentation/votipka-understanding). USENIX Security 2020.'
        optional: true
    slides:
      pptx: '/courses/cis-7000-spring2026/downloads/SSEM-BIBIFI.pptx'
      pdf: '/courses/cis-7000-spring2026/downloads/SSEM-BIBIFI.pdf'

  - date: "Feb 17"
    topic: "Measurements of security #2 (ops and end-user oriented)"
    readings:
      - 'Dekoven et al, [Measuring Security Practices and How They Impact Security](https://dl.acm.org/doi/pdf/10.1145/3355369.3355571), IMC 2019'
      - 'Casey F. Breen, Cormac Herley, Elissa Redmiles. [A Large-Scale Measurement of Cybercrime Against Individuals](https://dl.acm.org/doi/10.1145/3491102.3517613), In CHI 2022. (NB: [Data analysis package](https://github.com/caseybreen/cybercrime_code_release), done in R)'
    slides:
      pptx: '/courses/cis-7000-spring2026/downloads/SSEM-measuring-harm.pptx'
      pdf: '/courses/cis-7000-spring2026/downloads/SSEM-measuring-harm.pdf'

