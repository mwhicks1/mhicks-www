schedule:
  - date: "Jan 15"
    topic: "Introduction and syllabus"
    readings:
      - 'S. Keshav. [How to Read a Paper](http://ccr.sigcomm.org/online/files/p83-keshavA.pdf). ACM SIGCOMM Computer Communication Review, Volume 37, Number 3, July 2007.'
    slides:
      pptx: '/courses/cis-7000-spring2026/downloads/SSEM-intro.pptx'
      pdf: '/courses/cis-7000-spring2026/downloads/SSEM-intro.pdf'

  - date: "Jan 20"
    topic: "Attacks: Vulnerability exploitation"
    readings:
      - 'MITRE. [2025 CWE Top 25 Most Dangerous Software Weaknesses](https://cwe.mitre.org/top25/archive/2025/2025_cwe_top25.html). Dec 2025.'
      - 'Marc Frederic Gomez. [Top 25 CWE 2025 - Technical Analysis](https://blog.marcfredericgomez.com/top-25-cwe-2025-technical-analysis/). Blog article, Dec 2025.'
      - 'OWASP. [OWASP Top 10: The Ten Most Critical Web Application Security Risks](https://owasp.org/Top10/2025/0x00_2025-Introduction/). Dec 2025.'
      - 'Christian Heilmann. [Web Security: Are You Part of the Problem?](https://www.smashingmagazine.com/2010/01/web-security-primer-are-you-part-of-the-problem/). Smashing magazine, Jan 2010.'
    slides:
      pptx: '/courses/cis-7000-spring2026/downloads/SSEM-CWE-top25.pptx'
      pdf: '/courses/cis-7000-spring2026/downloads/SSEM-CWE-top25.pdf'

  - date: "Jan 22"
    topic: "Attacks: Exploiting the human"
    assignment:
      name: "Proj 1: Security Breach Communication & Persuasion Video"
      pdf: '/courses/cis-7000-spring2026/downloads/ssem_project_1.pdf'
      due: "Feb 9"
    readings: 
      - 'Ho, Grant, et al. [Understanding the efficacy of phishing training in practice](https://www.sysnet.ucsd.edu/~voelker/pubs/phishtrain-oakland25.pdf). 2025 IEEE Symposium on Security and Privacy (SP). IEEE, 2025.'
      - text: 'Lorrie Faith Cranor. [A Framework for Reasoning About the Human in the Loop](https://www.usenix.org/legacy/events/upsec08/tech/full_papers/cranor/cranor.pdf). In Proceedings of UPSEC 2008.'
        optional: true
    slides:
      pptx: '/courses/cis-7000-spring2026/downloads/SSEM-human-vuln.pptx'
      pdf: '/courses/cis-7000-spring2026/downloads/SSEM-human-vuln.pdf'

  - date: "Jan 27"
    topic: '[Speaking and writing well (generally, and for security)](/courses/cis-7000-spring2026/giving-a-talk)'
    readings: 
      - 'Ernst, Michael. [How to give a technical presentation](https://homes.cs.washington.edu/~mernst/advice/giving-talk.html)'
      - 'Click the title to the left to see the talk slides; a recording of this talk is on the [Canvas site](https://canvas.upenn.edu/courses/1911047)' 

  - date: "Jan 29"
    topic: "Cybersecurity economics"
    readings:
     - 'Ross Anderson. [Why information security is hard - an economic perspective](https://www.acsac.org/2001/papers/110.pdf). Seventeenth annual computer security applications conference (ACSAC). IEEE, 2001.'
     - 'Ian Grigg, [The Market for Silver Bullets](https://iang.org/papers/market_for_silver_bullets.html), 2008.'
    slides:
      pptx: '/courses/cis-7000-spring2026/downloads/SSEM-economics.pptx'
      pdf: '/courses/cis-7000-spring2026/downloads/SSEM-economics.pdf'

