        note: 'Recommended sections in these references given in lecture notes' 
      - text: 'Jenny Tang, Lujo Bauer, and Nicolas Christin. [Misuse, Misreporting, Misinterpretation of Statistical Methods in Usable Privacy and Security Papers.](https://www.usenix.org/conference/soups2025/presentation/tang) In SOUPS 25.'
        optional: true
      - text: '**Reference**: [sample vulnerability data](/courses/cis-7000-spring2026/downloads/sample_vuln_data.csv) used in lecture'
    slides:
      pptx: '/courses/cis-7000-spring2026/downloads/SSEM-data-analysis-1.pptx'
      pdf: '/courses/cis-7000-spring2026/downloads/SSEM-data-analysis-1.pdf'

