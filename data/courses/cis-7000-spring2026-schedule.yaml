    readings:
      - text: '[Experimental Design and Analysis](https://www.stat.cmu.edu/~hseltman/309/Book/Book.pdf) and [Introduction to Data Analysis](https://michael-franke.github.io/intro-data-analysis/)'
        note: 'Recommended sections in these references given in lecture notes' 
    slides:
