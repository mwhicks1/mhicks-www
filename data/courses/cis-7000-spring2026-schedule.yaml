      - text: 'Votipka, Daniel, Kelsey R. Fulton, James Parker, Matthew Hou, Michelle L. Mazurek, and Michael Hicks. [Understanding security mistakes developers make: Qualitative analysis from build it, break it, fix it](https://www.usenix.org/conference/usenixsecurity20/presentation/votipka-understanding). USENIX Security 2020.'
