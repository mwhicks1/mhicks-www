    topic: "Heartbleed's effects, and gamified security training"
    readings:
      - 'Zakir Durumeric, Frank Li, James Kasten, Nicholas Weaver, Johanna Amann, Jethro Beekman, Mathias Payer, David Adrian, Vern Paxson, Michael Bailey, J. Alex Halderman. [The Matter of Heartbleed](https://faculty.cc.gatech.edu/~frankli/papers/li-imc2014.pdf), In ACM Internet Measurement Conference 2014.'
      - text: 'Silic, M., & Lowry, P. B. [Using Design-Science Based Gamification to Improve Organizational Security Training and Compliance](https://doi-org.proxy.library.upenn.edu/10.1080/07421222.2019.1705512). Journal of Management Information Systems, 37(1), 129-161, 2020.'
